aid: ahara
name: AHARA
description: >-
  AHARA is a Los Angeles personalized-nutrition company founded in 2022 by physician
  nutritionist Dr. Melina Jampolis and The RealReal founder Julie Wainwright, funded with a
  $10.25M seed round led by Greycroft. It pairs a health questionnaire and at-home genetic,
  epigenetic and blood-biomarker testing with registered-dietitian guidance and a consumer
  app (Food Health Rx) that turns the results into a personalized food-as-medicine plan,
  sold direct to consumers and through employers, health plans and providers. In late 2024
  the company rebranded as Food Health Collective and moved its web presence to
  foodhealthcollective.org; the original ahara.com domain is now registrar-suspended
  (clientHold, NXDOMAIN) and the ahara.health Squarespace site has expired. AHARA operates
  no developer program: there is no portal, no documentation, no API reference, no public
  package, no GitHub organization and no machine-readable contract on any host it controls.
